<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./ui.css">
    <title>qb-vehiclesales</title>
</head>
    <body>
        <div class="sell-container" id="app">
            <div id="sell-contract" class="centred">
                <div id="form-header" class="v-centred-container">
                    <object type="image/svg+xml" data="logo.svg" class="logo">
                        ショップロゴ </object>
                    <div>
                        <div id="biz-name" class="vertical-center">{{ bizName }}</div>
                    </div>
                </div>

                <div id="the-form" class="centred">
                    <div class="form-entry">
                        <div id="seller-name" class="form-field" >{{ sellerName }}</div>
                        <span class="form-field-summary">(販売者の名前)</span>
                    </div>
                    <div class="form-entry">
                        <div id="seller-banknr" class="form-field">{{ bankAccount }}</div>
                        <span class="form-field-summary">(銀行口座番号)</span>
                    </div>
                    <div class="form-entry">
                        <div id="seller-telnr" class="form-field">{{ phoneNumber }}</div>
                        <span class="form-field-summary">(電話番号)</span>
                    </div>
                    <div class="form-entry">
                        <div id="vehicle-plate" class="form-field">{{ licensePlate }}</div>
                        <span class="form-field-summary">(ナンバープレート)</span>
                    </div>
                    <div class="form-entry">
                        <div class="form-field" v-if="mode==='sellVehicle'">
                            <input type="text"
                                class="vehicle-description"
                                maxlength="500"
                                placeholder="ここに車両の説明を入力してください（最大500文字）"
                                v-model="vehicleDescription">
                        </div>
                        <span class="form-field-summary"v-if="mode==='sellVehicle'">(車両の説明、最大500文字)</span>
                        <div id="vehicle-plate" class="form-field" v-if="mode==='buyVehicle'">{{ vehicleDescription }}</div>
                    </div>

                    <div class="form-entry" v-if="mode==='sellVehicle'">
                        <table class="pricing-table centred-h">
                            <tr><td><span class="table-field-heading">販売価格:</span>
                                <input type="text"
                                    class="vehicle-sell-price"
                                    placeholder="車両価格をここに入力"
                                    v-model="sellPrice">
                            </td></tr>
                            <tr><td><span class="table-field-heading">税金:</span><span id="tax"> &dollar; {{ tax }}</span></td></tr>
                            <tr><td><span class="table-field-heading">モズリーの取り分:</span><span id="mosley-cut"> &dollar; {{ mosleys }}</span></td></tr>
                            <tr><td><span class="table-field-heading">合計収益:</span><span id="total-money"> &dollar; {{ total }}</span></td></tr>
                        </table>
                    </div>

                    <div class="form-entry" v-if="mode==='buyVehicle'">
                        <table class="pricing-table centred-h">
                            <tr><td><span class="table-field-heading">車両価格:</span><span id="tax"> &dollar; {{ sellPrice }}</span></td></tr>
                        </table>
                    </div>

                    <div class="btn" id="sell-vehicle" v-if="mode==='sellVehicle'" @click="sell(sellPrice)"><p>売却</p></div>
                    <div class="btn" id="buy-vehicle" v-if="mode==='buyVehicle'" @click="buy()"><p>購入</p></div>
                    <div class="btn" id="buy-vehicle-back" v-if="showTakeBackOption" @click="takeBack()"><p>取り戻す</p></div>

                    <div v-if="errors.length" class="errors centred-h">
                        <ul>
                            <li v-for="error in errors">{{ error }}</li>
                        </ul>
                    </div>
                </div>

            </div>

        </div>

        <script src="./vue.min.js"></script>
        <script src="./ui.js"></script>
    </body>
</html>
