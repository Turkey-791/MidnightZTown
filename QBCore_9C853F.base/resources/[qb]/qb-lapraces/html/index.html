<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QB ラップレース</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
    <body>
        <div class="container">
            <div class="ui">
                <div class="editor">
                    <span id="editor-racename">レース: テストレース</span>
                    <span id="editor-checkpoints">チェックポイント: 1 / ?</span>
                    <span id="editor-keys-add"><span style="color: rgb(0, 201, 0);">7</span> - チェックポイントを追加</span>
                    <span id="editor-keys-tiredistance"></span>
                    <span id="editor-keys-delete"></span>
                    <span id="editor-keys-cancel"><span style="color: rgb(255, 43, 43);">9</span> - エディタをキャンセル</span>
                    <span id="editor-keys-save"><span style="color: rgb(0, 201, 0);">K</span> - レースを保存</span>
                </div>

                <div class="race">
                    <span id="race-racename">レース: テストレース</span>
                    <span id="race-checkpoints">チェックポイント: 1 / 1</span>
                    <span id="race-lap">ラップ: 1 / 1</span>
                    <span id="race-time">現在のラップ: </span>
                    <span id="race-besttime">ベストラップ: </span>
                    <span id="race-totaltime">合計タイム: </span>
                </div>
            </div>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
